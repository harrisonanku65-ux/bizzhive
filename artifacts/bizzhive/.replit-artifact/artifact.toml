kind = "web"
previewPath = "/"
title = "BizzHive"
version = "1.0.0"
id = "artifacts/bizzhive"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26158

[services.development]
run = "pnpm --filter @workspace/bizzhive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bizzhive", "run", "build" ]
publicDir = "artifacts/bizzhive/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26158"
BASE_PATH = "/"
