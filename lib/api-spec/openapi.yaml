      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required: [currentPassword, newPassword]

    ChangePasswordResponse:
      type: object
      properties:
        status:
          type: string
          enum: [changed]
      required: [status]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        courseCount:
          type: integer
        productCount:
          type: integer
      required: [id, name, slug, courseCount, productCount]

    Vendor:
