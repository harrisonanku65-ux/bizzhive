            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Not authenticated

  /admin/disputes:
    get:
      operationId: listDisputes
      tags: [admin]
      summary: List disputed orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, all]
      responses:
        "200":
          description: Disputed orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisputeOrder"
        "401":
          description: Not authenticated

  /admin/disputes/{id}:
    get:
      operationId: getDispute
      tags: [admin]
      summary: Get a single disputed order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Disputed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeOrder"
        "404":
          description: Order not found

  /admin/disputes/{id}/resolve:
    post:
      operationId: resolveDispute
      tags: [admin]
      summary: Resolve a dispute by releasing funds or refunding the buyer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDisputeBody"
      responses:
        "200":
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveDisputeResponse"
        "400":
          description: Invalid resolution or order not under dispute
        "502":
          description: Refund could not be processed

  /admin/support-tickets:
    get:
      operationId: listSupportTickets
      tags: [admin]
      summary: Support queue, Premium vendors first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, all]
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
