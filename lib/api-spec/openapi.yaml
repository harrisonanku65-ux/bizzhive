openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BizzHive Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: vendors
    description: Vendor operations
  - name: courses
    description: Course operations
  - name: products
    description: Digital product operations
  - name: cart
    description: Shopping cart operations
  - name: orders
    description: Order operations
  - name: dashboard
    description: Dashboard and analytics
  - name: payments
    description: Payment processing (Paystack & Flutterwave)
  - name: payouts
    description: Vendor payout management
  - name: auth
    description: Buyer and seller authentication

paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new buyer or seller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
        "409":
          description: Email already exists

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      parameters:
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Vendor not found

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses with filters
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, popular, price_low, price_high, rating]
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course details with lessons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Course not found
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseBody"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Course deleted

  /courses/{courseId}/lessons:
    post:
      operationId: createLesson
      tags: [courses]
      summary: Add a lesson to a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonBody"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List digital products
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [ebook, template, software, asset, other]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, popular, price_low, price_high, rating]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a digital product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted

  /courses/{id}/reviews:
    get:
      operationId: listCourseReviews
      tags: [courses]
      summary: List reviews for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createCourseReview
      tags: [courses]
      summary: Add a review for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{id}:
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create order from cart
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /payments/initialize:
    post:
      operationId: initializePayment
      tags: [payments]
      summary: Initialize a payment with Paystack or Flutterwave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitializeBody"
      responses:
        "200":
          description: Payment initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitializeResponse"

  /payments/verify/{reference}:
    get:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify a Paystack payment by reference
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerifyResponse"

  /payments/flutterwave/verify:
    post:
      operationId: verifyFlutterwavePayment
      tags: [payments]
      summary: Verify a Flutterwave payment by transaction id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlutterwaveVerifyBody"
      responses:
        "200":
          description: Payment verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerifyResponse"

  /payments/paystack/webhook:
    post:
      operationId: paystackWebhook
      tags: [payments]
      summary: Paystack webhook handler
      responses:
        "200":
          description: Webhook processed

  /payments/flutterwave/webhook:
    post:
      operationId: flutterwaveWebhook
      tags: [payments]
      summary: Flutterwave webhook handler
      responses:
        "200":
          description: Webhook processed

  /vendors/{vendorId}/payout-settings:
    put:
      operationId: updateVendorPayoutSettings
      tags: [payouts]
      summary: Update vendor payout settings (MoMo / bank)
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorPayoutSettingsBody"
      responses:
        "200":
          description: Payout settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPayoutSettings"

  /payouts/process/{orderId}:
    post:
      operationId: processOrderPayouts
      tags: [payouts]
      summary: Process vendor payouts for a completed order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payout results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutResult"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get marketplace overview stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/vendor/{vendorId}/stats:
    get:
      operationId: getVendorStats
      tags: [dashboard]
      summary: Get vendor-specific stats
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorStats"

  /dashboard/featured:
    get:
      operationId: getFeaturedContent
      tags: [dashboard]
      summary: Get featured courses and products for homepage
      responses:
        "200":
          description: Featured content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedContent"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent marketplace activity
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/top-vendors:
    get:
      operationId: getTopVendors
      tags: [dashboard]
      summary: Get top-performing vendors
      responses:
        "200":
          description: Top vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"

  /dashboard/category-breakdown:
    get:
      operationId: getCategoryBreakdown
      tags: [dashboard]
      summary: Get course/product counts by category
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

components:
  schemas:
    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [buyer, seller]
          default: buyer
        phone:
          type: string
        vendorName:
          type: string
        vendorBio:
          type: string
        vendorLocation:
          type: string
      required: [email, password, firstName, lastName, role]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        role:
          type: string
          enum: [buyer, seller, admin]
        vendorId:
          type: ["integer", "null"]
        avatar:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
      required: [id, email, role]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        courseCount:
          type: integer
        productCount:
          type: integer
      required: [id, name, slug, courseCount, productCount]

    Vendor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        bio:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        rating:
          type: number
          format: float
        totalSales:
          type: integer
        totalCourses:
          type: integer
        totalProducts:
          type: integer
        featured:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, rating, totalSales, totalCourses, totalProducts, featured, createdAt]

    CreateVendorBody:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        location:
          type: string
        avatar:
          type: string
      required: [name]

    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        thumbnail:
          type: ["string", "null"]
        price:
          type: number
          format: float
        currency:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: ["string", "null"]
        lessonsCount:
          type: integer
        rating:
          type: number
          format: float
        reviewsCount:
          type: integer
        enrollments:
          type: integer
        featured:
          type: boolean
        published:
          type: boolean
        vendorId:
          type: integer
        vendorName:
          type: string
        vendorAvatar:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, slug, price, currency, level, lessonsCount, rating, reviewsCount, enrollments, featured, published, vendorId, vendorName, categoryId, categoryName, createdAt]

    CourseDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        thumbnail:
          type: ["string", "null"]
        price:
          type: number
          format: float
        currency:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: ["string", "null"]
        lessonsCount:
          type: integer
        rating:
          type: number
          format: float
        reviewsCount:
          type: integer
        enrollments:
          type: integer
        featured:
          type: boolean
        published:
          type: boolean
        vendorId:
          type: integer
        vendorName:
          type: string
        vendorAvatar:
          type: ["string", "null"]
        vendorBio:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        createdAt:
          type: string
          format: date-time
      required: [id, title, slug, price, currency, level, lessonsCount, rating, reviewsCount, enrollments, featured, published, vendorId, vendorName, categoryId, categoryName, lessons, createdAt]

    CreateCourseBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        thumbnail:
          type: string
        price:
          type: number
        currency:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: string
        vendorId:
          type: integer
        categoryId:
          type: integer
      required: [title, price, vendorId, categoryId, level]

    UpdateCourseBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        thumbnail:
          type: string
        price:
          type: number
        currency:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: string
        categoryId:
          type: integer
        published:
          type: boolean
        featured:
          type: boolean

    Lesson:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        sortOrder:
          type: integer
        isFree:
          type: boolean
        courseId:
          type: integer
      required: [id, title, sortOrder, isFree, courseId]

    CreateLessonBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        duration:
          type: string
        sortOrder:
          type: integer
        isFree:
          type: boolean
      required: [title, sortOrder]

    Product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        thumbnail:
          type: ["string", "null"]
        price:
          type: number
          format: float
        currency:
          type: string
        productType:
          type: string
          enum: [ebook, template, software, asset, other]
        fileUrl:
          type: ["string", "null"]
        rating:
          type: number
          format: float
        reviewsCount:
          type: integer
        salesCount:
          type: integer
        featured:
          type: boolean
        published:
          type: boolean
        vendorId:
          type: integer
        vendorName:
          type: string
        vendorAvatar:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, slug, price, currency, productType, rating, reviewsCount, salesCount, featured, published, vendorId, vendorName, categoryId, categoryName, createdAt]

    CreateProductBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        thumbnail:
          type: string
        price:
          type: number
        currency:
          type: string
        productType:
          type: string
          enum: [ebook, template, software, asset, other]
        fileUrl:
          type: string
        vendorId:
          type: integer
        categoryId:
          type: integer
      required: [title, price, vendorId, categoryId, productType]

    UpdateProductBody:
      type: object
      properties:
        title:
