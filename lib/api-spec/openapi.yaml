          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseSupportTicketBody"
      responses:
        "200":
          description: Ticket closed
          content:
            application/json:
              schema:
