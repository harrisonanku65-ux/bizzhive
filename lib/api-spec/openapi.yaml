components:
  schemas:
    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: >-
            At least 8 characters with an uppercase letter, a lowercase letter,
            a number and a symbol. Must not be a common password or contain the
            user's own name or email.
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [buyer, seller]
          default: buyer
        phone:
          type: string
        vendorName:
          type: string
        vendorBio:
          type: string
        vendorLocation:
          type: string
      required: [email, password, firstName, lastName, role]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        role:
          type: string
          enum: [buyer, seller, admin]
        vendorId:
          type: ["integer", "null"]
        avatar:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        emailVerified:
          type: boolean
      required: [id, email, role, emailVerified]

    DeleteAccountBody:
      type: object
      properties:
        password:
          type: string
      required: [password]

    DeleteAccountResponse:
      type: object
      properties:
        status:
          type: string
          enum: [deleted, anonymized]
        message:
          type: string
      required: [status]

    VerifyEmailResponse:
      type: object
      properties:
        status:
          type: string
          enum: [verified]
        email:
          type: string
      required: [status, email]

    ResendVerificationResponse:
      type: object
      properties:
        status:
          type: string
          enum: [sent, already_verified]
      required: [status]

    UpdateProfileBody:
