          format: float
        averageRating:
          type: number
          format: float
        totalEnrollments:
          type: integer
        currency:
          type: string
      required:
        [
          totalCourses,
          totalProducts,
          totalSales,
          totalRevenue,
          averageRating,
          totalEnrollments,
          currency,
        ]

    FeaturedContent:
      type: object
      properties:
        featuredCourses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        featuredProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        topVendors:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
      required: [featuredCourses, featuredProducts, topVendors]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [new_course, new_product, new_review, new_order, new_vendor]
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, type, title, description, createdAt]

    CategoryBreakdown:
      type: object
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        courseCount:
          type: integer
        productCount:
          type: integer
        totalItems:
          type: integer
      required:
        [categoryId, categoryName, courseCount, productCount, totalItems]

    PaymentInitializeBody:
      type: object
      properties:
        provider:
          type: string
          enum: [paystack, flutterwave]
        email:
          type: string
          format: email
        phone:
          type: string
        momoNetwork:
          type: string
          enum: [MTN, Vodafone, AirtelTigo]
        paymentMethod:
          type: string
          enum: [card, mobile_money]
      required: [provider, email]

    PaymentInitializeResponse:
      type: object
      properties:
        orderId:
          type: integer
        reference:
          type: string
        accessCode:
          type: ["string", "null"]
        paymentUrl:
          type: ["string", "null"]
        paystackPublicKey:
          type: ["string", "null"]
        flutterwavePublicKey:
          type: ["string", "null"]
        provider:
          type: string
        amount:
          type: number
        currency:
          type: string
      required: [orderId, reference, provider, amount, currency]

    FlutterwaveVerifyBody:
      type: object
      properties:
        transactionId:
          type: string
        reference:
          type: string
      required: [transactionId, reference]

    PaymentVerifyResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failed, pending]
        orderId:
          type: integer
        reference:
          type: string
        message:
          type: string
        payoutScheduled:
          type: boolean
      required: [status, reference, message]

    VendorPayoutSettingsBody:
      type: object
      properties:
        momoNumber:
          type: string
        momoNetwork:
          type: string
          enum: [MTN, Vodafone, AirtelTigo]
        email:
          type: string
      required: [momoNumber, momoNetwork]

    VendorPayoutSettings:
      type: object
      properties:
        vendorId:
          type: integer
        momoNumber:
          type: ["string", "null"]
        momoNetwork:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        payoutPercentage:
          type: number
      required: [vendorId, payoutPercentage]

    SubscribeVendorBody:
      type: object
      properties:
        email:
          type: string
          format: email
        tier:
          type: string
          enum: [pro, premium]
      required: [email, tier]

    SubscribeVendorResponse:
      type: object
      properties:
        vendorId:
          type: integer
        tier:
          type: string
        reference:
          type: string
        paymentUrl:
          type: string
        accessCode:
          type: string
        paystackPublicKey:
          type: string
      required: [vendorId, tier, reference, paymentUrl, paystackPublicKey]

    PayoutResult:
      type: object
      properties:
        orderId:
          type: integer
        payouts:
          type: array
          items:
            type: object
            properties:
              vendorId:
                type: integer
              vendorName:
                type: string
              amount:
                type: number
              status:
                type: string
              reference:
                type: string
            required: [vendorId, vendorName, amount, status]
      required: [orderId, payouts]

    # ------------------------------------------------------------------
    # Bookable session slots
    # ------------------------------------------------------------------

    SessionSlot:
      type: object
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendorName:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        price:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
          enum: [available, booked, completed, cancelled]
        published:
          type: boolean
        # Only returned to the buyer who paid, or the vendor who owns the slot.
        meetingUrl:
          type: ["string", "null"]
        meetingNotes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        [id, vendorId, categoryId, title, startsAt, durationMinutes, price, currency, status, published, createdAt]

    CreateSessionSlotBody:
      type: object
      properties:
        vendorId:
          type: integer
        categoryId:
          type: integer
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          default: 60
        price:
          type: number
        meetingUrl:
          type: string
        meetingNotes:
          type: string
      required: [vendorId, categoryId, title, startsAt, price]

    UpdateSessionSlotBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        price:
          type: number
        meetingUrl:
          type: string
        meetingNotes:
          type: string
        published:
          type: boolean

    DeleteSessionSlotResponse:
      type: object
      properties:
        id:
          type: integer
        deleted:
          type: boolean
      required: [id, deleted]

    SessionSlotStatusResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
      required: [id, status]

    # ------------------------------------------------------------------
    # Support
    # ------------------------------------------------------------------

    CreateSupportTicketBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        subject:
          type: string
        message:
          type: string
          minLength: 10
        requesterRole:
          type: string
          enum: [buyer, seller, other]
      required: [name, email, message]

    SupportTicketCreated:
      type: object
      properties:
        id:
          type: integer
        priority:
          type: string
          enum: [priority, standard, normal]
        status:
          type: string
        expectedResponse:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, priority, status, expectedResponse, createdAt]

    SupportPriority:
      type: object
      properties:
        priority:
          type: string
          enum: [priority, standard, normal]
        plan:
          type: ["string", "null"]
      required: [priority]

    SupportTicket:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        message:
          type: string
        requesterRole:
          type: string
        userId:
          type: ["integer", "null"]
        vendorId:
          type: ["integer", "null"]
        vendorPlan:
          type: ["string", "null"]
        priority:
          type: string
          enum: [priority, standard, normal]
        status:
          type: string
          enum: [open, closed]
        adminNotes:
          type: ["string", "null"]
        closedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, subject, message, priority, status, createdAt]

    CloseSupportTicketBody:
      type: object
      properties:
        adminNotes:
          type: string

    CloseSupportTicketResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
      required: [id, status]

    # ------------------------------------------------------------------
    # Vendor analytics (plan-gated)
    # ------------------------------------------------------------------

    RevenueTrendPoint:
      type: object
      properties:
        month:
          type: string
          description: YYYY-MM
        revenue:
          type: number
          format: float
        units:
          type: integer
      required: [month, revenue, units]

    TopListing:
      type: object
      properties:
        title:
          type: string
        itemType:
          type: ["string", "null"]
        revenue:
          type: number
          format: float
        units:
          type: integer
      required: [title, revenue, units]

    AdvancedAnalytics:
      type: object
      properties:
        uniqueBuyers:
          type: integer
        repeatBuyers:
          type: integer
        repeatBuyerRate:
          type: number
          format: float
        averageOrderValue:
          type: number
          format: float
        fundsHeldInEscrow:
          type: number
          format: float
        payoutPercentage:
          type: number
          format: float
      required: [uniqueBuyers, repeatBuyers, repeatBuyerRate, averageOrderValue, fundsHeldInEscrow]

    VendorAnalytics:
      type: object
      properties:
        vendorId:
          type: integer
        plan:
          type: string
          enum: [free, pro, premium]
        tier:
          type: string
          enum: [basic, standard, advanced]
        locked:
          type: boolean
        currency:
          type: string
        upgradeMessage:
          type: string
        summary:
          type: object
          properties:
            totalRevenue:
              type: number
              format: float
            unitsSold:
              type: integer
            orderCount:
              type: integer
          required: [totalRevenue, unitsSold, orderCount]
        revenueTrend:
          type: array
          items:
            $ref: "#/components/schemas/RevenueTrendPoint"
        topListings:
          type: array
          items:
            $ref: "#/components/schemas/TopListing"
        # Null on Free/Pro; populated on Premium.
        advanced:
          $ref: "#/components/schemas/AdvancedAnalytics"
      required: [vendorId, plan, tier, locked, currency, summary, revenueTrend, topListings]

    # ------------------------------------------------------------------
    # Admin console
    # ------------------------------------------------------------------

    AdminLoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
      required: [id, email, name]

    AdminOverview:
      type: object
      properties:
        openDisputes:
          type: integer
        awaitingConfirmation:
          type: integer
        openTickets:
          type: integer
        priorityTickets:
          type: integer
        fundsHeldInEscrow:
          type: number
          format: float
      required:
        [openDisputes, awaitingConfirmation, openTickets, priorityTickets, fundsHeldInEscrow]

    DisputeOrderItem:
      type: object
      properties:
        title:
          type: string
        price:
          type: number
          format: float
        itemType:
          type: string
        vendorName:
          type: ["string", "null"]
      required: [title, price]

    DisputeOrder:
      type: object
      properties:
        id:
          type: integer
        total:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        paymentProvider:
          type: ["string", "null"]
        paymentReference:
          type: ["string", "null"]
        deliveryStatus:
          type: string
        disputeReason:
          type: ["string", "null"]
        disputeRaisedAt:
          type: ["string", "null"]
          format: date-time
        payoutStatus:
          type: string
        refundedAmount:
          type: number
          format: float
        refundableAmount:
          type: number
          format: float
        resolution:
          type: ["string", "null"]
        resolutionNotes:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        buyerEmail:
          type: ["string", "null"]
        buyerName:
          type: ["string", "null"]
        vendorNames:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DisputeOrderItem"
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          total,
          currency,
          status,
          paymentStatus,
          deliveryStatus,
          payoutStatus,
          refundedAmount,
          refundableAmount,
          vendorNames,
          items,
          createdAt,
        ]

    ResolveDisputeBody:
      type: object
      properties:
        resolution:
          type: string
          enum: [released, refunded_full, refunded_partial]
        amount:
          type: number
          description: Required for refunded_partial; must be less than the refundable total.
        notes:
          type: string
      required: [resolution]

    ResolveDisputeResponse:
      type: object
      properties:
        orderId:
          type: integer
        resolution:
          type: string
        refundedAmount:
          type: number
          format: float
        refund:
          type: ["object", "null"]
          additionalProperties: true
        payout:
          type: ["object", "null"]
          additionalProperties: true
        resolvedBy:
          type: string
      required: [orderId, resolution, refundedAmount]
