openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BizzHive Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: vendors
    description: Vendor operations
  - name: courses
    description: Course operations
  - name: products
    description: Digital product operations
  - name: cart
    description: Shopping cart operations
  - name: orders
    description: Order operations
  - name: dashboard
    description: Dashboard and analytics
  - name: payments
    description: Payment processing (Paystack & Flutterwave)
  - name: payouts
    description: Vendor payout management
  - name: auth
    description: Buyer and seller authentication
  - name: sessions
    description: Bookable one-on-one session slots (coaching, consultations)
  - name: reviews
    description: Course, product and vendor reviews
  - name: support
    description: Support requests
  - name: admin
    description: Admin console — dispute resolution and support queue

paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new buyer or seller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
        "409":
          description: Email already exists

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Validation error
        "401":
          description: Not authenticated or current password incorrect

  /auth/delete-account:
    post:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete or anonymize the current user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountBody"
      responses:
        "200":
          description: Account deleted or anonymized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResponse"
        "401":
          description: Not authenticated or incorrect password

  /auth/verify-email:
    get:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using the token from the verification email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
        "400":
          description: Invalid or expired token

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Resend the verification email to the signed-in user
      responses:
        "200":
          description: Verification email sent, or already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationResponse"
        "401":
          description: Not authenticated
        "429":
          description: Too many requests

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      parameters:
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Vendor not found

  /vendors/{id}/subscribe:
    post:
      operationId: subscribeVendor
      tags: [vendors]
      summary: Start a Pro or Premium subscription for a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeVendorBody"
      responses:
        "200":
          description: Subscription initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeVendorResponse"
        "400":
          description: Validation error
        "404":
          description: Vendor not found

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses with filters
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, popular, price_low, price_high, rating]
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course details with lessons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Course not found
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseBody"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Course deleted

  /courses/{courseId}/lessons:
    post:
      operationId: createLesson
      tags: [courses]
      summary: Add a lesson to a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonBody"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List digital products
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [ebook, template, software, asset, other]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, popular, price_low, price_high, rating]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a digital product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted

  /courses/{id}/reviews:
    get:
      operationId: listCourseReviews
      tags: [courses]
      summary: List reviews for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createCourseReview
      tags: [courses]
      summary: Add a review for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{id}:
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create order from cart
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/confirm-delivery:
    post:
      operationId: confirmDelivery
      tags: [orders]
      summary: Buyer confirms delivery, releasing the escrowed payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery confirmed and payout released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmDeliveryResponse"
        "400":
          description: Order is not awaiting confirmation
        "404":
          description: Order not found

  /orders/{id}/report-issue:
    post:
      operationId: reportOrderIssue
      tags: [orders]
      summary: Buyer raises a dispute instead of confirming delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIssueBody"
      responses:
        "200":
          description: Dispute raised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportIssueResponse"
        "400":
          description: Order is not awaiting confirmation
        "404":
          description: Order not found

  /session-slots:
    get:
      operationId: listSessionSlots
      tags: [sessions]
      summary: List upcoming bookable session slots
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: categoryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Available session slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSlot"
    post:
      operationId: createSessionSlot
      tags: [sessions]
      summary: Publish a bookable session slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionSlotBody"
      responses:
        "201":
          description: Slot published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSlot"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Plan listing limit reached

  /session-slots/{id}:
    put:
      operationId: updateSessionSlot
      tags: [sessions]
      summary: Update an unbooked session slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionSlotBody"
      responses:
        "200":
          description: Slot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSlot"
        "400":
          description: Slot is booked or payload invalid
        "404":
          description: Slot not found
    delete:
      operationId: deleteSessionSlot
      tags: [sessions]
      summary: Delete an unbooked session slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Slot deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionSlotResponse"
        "400":
          description: Slot is booked
        "404":
          description: Slot not found

  /session-slots/{id}/cancel:
    post:
      operationId: cancelSessionSlot
      tags: [sessions]
      summary: Cancel a session slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Slot cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSlotStatusResponse"

  /session-slots/{id}/complete:
    post:
      operationId: completeSessionSlot
      tags: [sessions]
      summary: Mark a booked session as delivered
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Slot marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSlotStatusResponse"

  /vendors/{vendorId}/session-slots:
    get:
      operationId: listVendorSessionSlots
      tags: [sessions]
      summary: List all of a vendor's session slots, including booked ones
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor session slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSlot"

  /my-bookings:
    get:
      operationId: listMyBookings
      tags: [sessions]
      summary: List sessions the current visitor has booked
      responses:
        "200":
          description: Booked sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSlot"

  /products/{id}/reviews:
    get:
      operationId: listProductReviews
      tags: [reviews]
      summary: List reviews for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createProductReview
      tags: [reviews]
      summary: Add a review for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "409":
          description: Already reviewed by this account

  /vendors/{id}/reviews:
    get:
      operationId: listVendorReviews
      tags: [reviews]
      summary: List reviews for a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createVendorReview
      tags: [reviews]
      summary: Add a review for a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "409":
          description: Already reviewed by this account

  /vendors/{vendorId}/all-reviews:
    get:
      operationId: listAllVendorReviews
      tags: [reviews]
      summary: Every review across a vendor's listings and profile
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews with the reviewed item's title
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedReview"

  /reviews/{id}/respond:
    post:
      operationId: respondToReview
      tags: [reviews]
      summary: Seller responds publicly to a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToReviewBody"
      responses:
        "200":
          description: Response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "403":
          description: Not your listing

  /support/tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Raise a support request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketCreated"
        "400":
          description: Validation error

  /support/my-priority:
    get:
      operationId: getSupportPriority
      tags: [support]
      summary: Support priority band for the current account
      responses:
        "200":
          description: Priority band
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportPriority"

  /dashboard/vendor/{vendorId}/analytics:
    get:
      operationId: getVendorAnalytics
      tags: [dashboard]
      summary: Plan-gated vendor analytics
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analytics for the vendor's plan tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAnalytics"
        "404":
          description: Vendor not found

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login (separate from buyer/seller auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials

  /admin/me:
