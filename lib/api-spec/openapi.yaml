      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        bio:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        rating:
          type: number
          format: float
        totalSales:
          type: integer
        totalCourses:
          type: integer
        totalProducts:
          type: integer
        featured:
